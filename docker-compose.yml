
networks:
  caddynet:
    external: true

services:

  # RustFS main service
  rustfs:
    security_opt:
      - "no-new-privileges:true"
    image: rustfs/rustfs:1.0.0-rc.5
    container_name: rustfs-server
    ports:
      - "9000:9000" # S3 API port
      - "9001:9001" # Console port
    environment:
      - RUSTFS_VOLUMES=/data/rustfs{0..3} # Define 4 storage volumes
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS=*
      # SECURITY: these defaults are public and well-known.
      # Override via env vars before exposing the listener beyond localhost.
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY:-rustfsadmin}
      - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY:-rustfsadmin}
      - RUSTFS_OBS_LOGGER_LEVEL=info
      - RUSTFS_TLS_PATH=/opt/tls
    volumes:
      - /opt/1panel/docker/compose/rustfs/data/rustfs0:/data/rustfs0
      - /opt/1panel/docker/compose/rustfs/data/rustfs1:/data/rustfs1
      - /opt/1panel/docker/compose/rustfs/data/rustfs2:/data/rustfs2
      - /opt/1panel/docker/compose/rustfs/data/rustfs3:/data/rustfs3
      - /opt/1panel/docker/compose/rustfs/data/logs:/app/logs
      
      # - ./deploy/data/pro:/data
      # - ./deploy/logs:/app/logs
      # TLS configuration directory.
      # Place at least:
      # - /opt/tls/ca.crt
      # - /opt/tls/rustfs_cert.pem
      # - /opt/tls/rustfs_key.pem
      # - ./deploy/data/certs/:/opt/tls
      # Permission baseline:
      # - default RustFS runtime user is 10001:10001
      # - ensure host mounts are writable by that user, or run with host-matched user
    networks:
      - caddynet
    restart: unless-stopped


